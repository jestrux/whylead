title: 'About Page'
fields:
  -
    handle: values
    field:
      type: replicator
      display: 'Company Values'
      sets:
        value:
          display: Value
          fields:
            -
              handle: icon
              field:
                type: text
                display: 'Icon (SVG path)'
            -
              handle: title
              field:
                type: text
                display: Title
            -
              handle: description
              field:
                type: textarea
                display: Description
  -
    handle: career_benefits
    field:
      type: replicator
      display: 'Career Benefits'
      sets:
        benefit:
          display: Benefit
          fields:
            -
              handle: icon
              field:
                type: text
                display: 'Icon (SVG path)'
            -
              handle: image
              field:
                type: assets
                display: Image
                container: uploads
                max_files: 1
            -
              handle: title
              field:
                type: text
                display: Title
            -
              handle: description
              field:
                type: textarea
                display: Description
  -
    handle: job_qualifications
    field:
      type: replicator
      display: 'Job Qualifications'
      sets:
        qualification:
          display: Qualification
          fields:
            -
              handle: icon
              field:
                type: text
                display: 'Icon (SVG path)'
            -
              handle: title
              field:
                type: text
                display: Title
