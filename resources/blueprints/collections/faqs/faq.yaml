title: FAQ
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Question
          -
            handle: answer
            field:
              type: textarea
              display: Answer
          -
            handle: faq_section
            field:
              type: terms
              display: Section
              taxonomies:
                - faq_section
              mode: select
